services:
  app:
    build:
      context: .
    ports:
      - "8080:80"
    volumes:
      - siluak-writable:/var/www/html/writable
      - ./.env:/var/www/html/.env:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${SILUAK_DB_NAME:-siluak}
      MARIADB_USER: ${SILUAK_DB_USER:-siluak}
      MARIADB_PASSWORD: ${SILUAK_DB_PASSWORD:-siluak-local-password}
      MARIADB_ROOT_PASSWORD: ${SILUAK_DB_ROOT_PASSWORD:-siluak-local-root-password}
    volumes:
      - siluak-database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  siluak-database:
  siluak-writable:
